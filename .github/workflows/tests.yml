name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-core:
    name: Minimum supported Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-minimum-core.txt
      - name: Install the minimum-Core test environment
        run: python -m pip install -r requirements-minimum-core.txt
      - name: Check installed Core matches the HACS minimum
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          declared = json.loads(Path("hacs.json").read_text())["homeassistant"]
          actual = version("homeassistant")
          assert actual == declared, f"Installed {actual}, declared {declared}"
          PY
      - name: Record the minimum-Core environment
        run: |
          python --version
          python -m pip show homeassistant pytest-homeassistant-custom-component
      - name: Run full Python test suite on the minimum Core
        run: python -m pytest -q --tb=short --junitxml=test-results/minimum-core.xml
      - name: Upload minimum-Core test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimum-core-test-results
          path: test-results/minimum-core.xml
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Record the development environment
        run: |
          python --version
          python -m pip show homeassistant pytest-homeassistant-custom-component

      - name: Run full Python test suite
        run: python -m pytest -q --tb=short --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
