name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-core:
    name: Minimum supported Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-minimum-core.txt
      - name: Install the minimum-Core test environment
        run: python -m pip install -r requirements-minimum-core.txt
      - name: Check installed Core matches the HACS minimum
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          declared = json.loads(Path("hacs.json").read_text())["homeassistant"]
          actual = version("homeassistant")
          assert actual == declared, f"Installed {actual}, declared {declared}"
          PY
      - name: Exercise setup, source updates, options and registered actions
        run: >-
          python -m pytest -q --tb=short
          tests/test_init.py
          tests/test_flow_sensors.py
          tests/test_sensor.py::test_current_power_updates_when_source_changes
          tests/test_config_flow.py::test_options_flow_saves_adaptive_good_price_settings

  tests:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full Python test suite
        run: python -m pytest -q --tb=short --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
