[mypy]
python_version = 3.14
namespace_packages = True
explicit_package_bases = True
files =
    custom_components/electricity_pro/statistics.py,
    custom_components/electricity_pro/pricing.py,
    custom_components/electricity_pro/grid_tariff.py,
    custom_components/electricity_pro/adaptive_price.py,
    custom_components/electricity_pro/good_time.py,
    custom_components/electricity_pro/settings.py
strict = True
disallow_any_unimported = True
follow_imports = normal
show_error_codes = True
warn_unused_configs = True
# This small pilot is fast without a cache; also check for stale overrides.
incremental = False

# Mypy discovers parent __init__.py while resolving these submodules. That
# file starts the HA-facing import graph; it is not a dependency of the pure
# calculation modules' type contracts. Skip exactly this
# parent, not its submodules. See docs/development.md for scope and remaining work.
[mypy-custom_components.electricity_pro]
follow_imports = skip
