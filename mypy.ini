[mypy]
python_version = 3.14
namespace_packages = True
explicit_package_bases = True
files =
    custom_components/electricity_pro/statistics.py,
    custom_components/electricity_pro/pricing.py,
    custom_components/electricity_pro/grid_tariff.py,
    custom_components/electricity_pro/adaptive_price.py,
    custom_components/electricity_pro/good_time.py,
    custom_components/electricity_pro/settings.py,
    custom_components/electricity_pro/base_load.py,
    custom_components/electricity_pro/timing_score.py,
    custom_components/electricity_pro/statistics_engine.py,
    custom_components/electricity_pro/history_storage.py,
    custom_components/electricity_pro/flow_compatibility.py,
    custom_components/electricity_pro/energy_flows.py,
    custom_components/electricity_pro/flow_sources.py,
    custom_components/electricity_pro/cost_ledger.py,
    custom_components/electricity_pro/nordpool.py,
    custom_components/electricity_pro/forecast.py,
    custom_components/electricity_pro/calculations.py,
    custom_components/electricity_pro/forecast_insights.py,
    custom_components/electricity_pro/coordinator.py,
    custom_components/electricity_pro/__init__.py
strict = True
disallow_any_unimported = True
follow_imports = normal
show_error_codes = True
warn_unused_configs = True
# This small pilot is fast without a cache; also check for stale overrides.
incremental = False
