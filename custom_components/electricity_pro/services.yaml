confirm_flow_meter_reset:
  name: Confirm optional energy meter reset
  description: >-
    Only after a genuine meter replacement/reset, accept the selected channel's
    current lifetime reading. Other channels and known totals are preserved.
    Do not use for temporary drops or outages.
  fields:
    config_entry_id:
      name: Electricity Pro configuration
      required: true
      selector:
        config_entry:
          integration: electricity_pro
    channel:
      name: Channel
      required: true
      selector:
        select:
          options:
            - production
            - grid_export
            - household
    source_entity:
      name: Currently configured lifetime energy source
      required: true
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: energy
    confirm_reset:
      name: Confirm genuine meter replacement or reset
      required: true
      selector:
        boolean:
confirm_meter_reset:
  name: Confirm lifetime meter replacement or reset
  description: >-
    Accept the current lifetime energy reading as a new baseline only after a
    genuine meter replacement or reset. Existing energy and cost totals are
    preserved. Do not use for temporary drops, outages or incorrect totals.
  fields:
    config_entry_id:
      name: Electricity Pro configuration
      required: true
      selector:
        config_entry:
          integration: electricity_pro
    confirm_reset:
      name: Confirm genuine meter replacement or reset
      required: true
      selector:
        boolean:
reset_monthly_energy:
  name: Reset monthly energy
  description: >-
    Discards the selected configuration's monthly energy total and starts at zero
    from the current reading. The remainder of this month is partial. Daily
    energy, costs, meter readings and Recorder history are not reset.
  fields:
    config_entry_id:
      name: Electricity Pro configuration
      required: true
      selector:
        config_entry:
          integration: electricity_pro
    confirm_reset:
      name: Confirm reset of monthly energy
      required: true
      selector:
        boolean:
get_market_price_forecast:
  name: Get market price forecast
  description: >-
    Returns the normalized market-price intervals currently held by one
    Electricity Pro configuration.
  fields:
    config_entry_id:
      name: Electricity Pro configuration
      description: Select the Electricity Pro configuration to query.
      required: true
      selector:
        config_entry:
          integration: electricity_pro
