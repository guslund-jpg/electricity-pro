# Svensk version. Uppdatera tillsammans med den engelska YAML-filen.
title: Electricity Pro Enhanced

views:
  - title: "Översikt"
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: custom:mushroom-title-card
        title: Electricity Pro
        subtitle: "Aktuella mätvärden, statistik och elanvändningsråd"

      - type: grid
        columns: 2
        square: false
        cards:
          # Fast effektskala i W. Anpassa max och severity till din vardagslast.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: "Aktuell effekt"
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Fast prisskala och färggränser i sensorns valuta per kWh.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: "Effektivt elpris"
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Ange din egen gräns för hög kostnad i severity.red, i valuta per timme.
              # Välj ett maxvärde som ligger över gränsen.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: "Kostnad per timme just nu"
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unavailable
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unknown
        card:
          type: custom:mushroom-template-card
          entity: binary_sensor.electricity_pro_good_time_to_use_electricity
          primary: >-
            {{ 'Bra tillfälle att använda el'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'Vänta på ett bättre pris' }}
          secondary: >-
            {% set price = states('sensor.electricity_pro_effective_price') %}
            Effektivt elpris:
            {{ '%.2f' | format(price | float)
               if price not in ['unknown', 'unavailable'] else price }}
            {{ state_attr('sensor.electricity_pro_effective_price',
                          'unit_of_measurement') or '' }}
          icon: >-
            {{ 'mdi:check-circle-outline'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'mdi:clock-outline' }}
          icon_color: >-
            {{ 'green'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'orange' }}
          tap_action:
            action: more-info

      - type: custom:mushroom-title-card
        title: "I dag"

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_today' %}
          {% set supplier = 'sensor.electricity_pro_cost_today' %}
          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if priced is not none %}
          **Delvis beräknad kostnad:** {{ priced | float(0) | round(2) }} kWh prissatta.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Delvis beräknad elhandelskostnad:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }}
          kWh prissatta.
          {% endif %}
          Totalen inkluderar fasta avgifter upplupna sedan midnatt.

          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if missing %}**Saknas:** {{ missing | join(', ')
          | replace('fixed_supplier_fee', 'fast elhandelsavgift')
          | replace('fixed_grid_fee', 'fast elnätsavgift')
          | replace('complete_variable_price', 'komplett rörligt elpris')
          | replace('_', ' ') }}.{% endif %}
          Effektavgifter och andra ej konfigurerade avgifter ingår inte.
          [Om kostnader och mätningens
          täckning](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/costs-and-pricing.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_energy_today
              name: "Energi i dag"
              icon: mdi:lightning-bolt
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_total_cost_estimate_today
              name: "Total kostnad (ca)"
              icon: mdi:cash-multiple
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cost_today
              name: "Elhandelskostnad i dag"
              icon: mdi:cash
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: "Effektivt snittpris"
              icon: mdi:chart-line
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_peak_power_today
              name: "Högsta effekt i dag"
              icon: mdi:flash-outline
              icon_color: amber
              layout: vertical

      - type: custom:mushroom-title-card
        title: "Den här månaden"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_energy_this_month
              name: "Energi den här månaden"
              icon: mdi:calendar-month
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_total_cost_estimate_this_month
              name: "Total kostnad (ca)"
              icon: mdi:calendar-month-outline
              icon_color: green
              layout: vertical

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_this_month' %}
          {% set supplier = 'sensor.electricity_pro_cost_this_month' %}
          {% set variable = state_attr(total, 'variable_cost') %}
          {% set fixed = state_attr(total, 'accrued_fixed_fees') %}
          {% set breakdown = state_attr(total, 'variable_cost_breakdown') %}
          {% set display = breakdown.display if breakdown is mapping else none %}
          {% set fixed_breakdown = state_attr(total, 'accrued_fixed_fee_breakdown') %}
          {% set currency = state_attr(total, 'unit_of_measurement') %}
          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if has_value(total) and is_number(variable) and is_number(fixed) and currency %}
          **Rörlig kostnad** {{ (display.total if display is mapping else '%.2f' | format(variable | float))
          | replace('.', ',') }} {{ currency }} ·
          {% if fixed_breakdown is mapping %}
          **Fast elhandelsavgift hittills**
          {% if is_number(fixed_breakdown.supplier) %}{{ '%.2f' | format(fixed_breakdown.supplier | float)
          | replace('.', ',') }} {{ currency }}{% else %}Uppgift saknas{% endif %} ·
          **Fast elnätsavgift hittills**
          {% if is_number(fixed_breakdown.grid) %}{{ '%.2f' | format(fixed_breakdown.grid | float)
          | replace('.', ',') }} {{ currency }}{% else %}Uppgift saknas{% endif %}.
          {% set missing = missing | reject('in', ['fixed_supplier_fee', 'fixed_grid_fee']) | list %}
          {% elif 'fixed_supplier_fee' in missing and 'fixed_grid_fee' in missing %}
          **Fasta avgifter hittills** Uppgift saknas.
          {% else %}
          **Kända fasta avgifter hittills** {{ '%.2f' | format(fixed | float) | replace('.', ',') }} {{ currency }}.
          {% endif %}
          {% if display is mapping %}
          {% set variable_cost_labels = {
            'market_energy': 'Spotpris',
            'supplier_markup': 'Elhandelspåslag',
            'supplier_price': 'Samlat elhandelspris',
            'bundled_price': 'Samlat rörligt pris',
            'energy_tax': 'Energiskatt',
            'variable_grid_fee': 'Rörlig elnätsavgift',
            'unallocated_cost': 'Äldre ospecificerad kostnad',
            'rounding_adjustment': 'Avrundning'
          } %}
          {{ '\n' }}
          {% for key, label in variable_cost_labels.items() if key in display.lines %}
          {{ '\n' }}- {{ label }} {{ display.lines[key] | replace('.', ',') }} {{ currency }}
          {%- endfor %}
          {{ '\n\n' }}
          {% else %}
          *Uppdelning saknas ännu.*
          {% endif %}
          {% endif %}

          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if has_value(total) and is_number(priced) %}
          **Delvis beräknad kostnad:** {{ priced | float(0) | round(2) }} kWh prissatta
          {%- if display is mapping %}, varav {{ breakdown.priced_energy_kwh | float | round(2) }}
          kWh med uppdelning{% endif %}.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Delvis beräknad elhandelskostnad:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }}
          kWh prissatta.
          {% endif %}

          {% set coverage = state_attr('sensor.electricity_pro_energy_this_month', 'coverage') %}
          {% if coverage == 'partial' %}
          {% set started = as_datetime(state_attr('sensor.electricity_pro_energy_this_month', 'tracking_started_at'),
          none) %}
          **Delvis uppmätt månadsenergi**{% if started is not none %}  sedan {{ as_local(started).strftime('%Y-%m-%d
          %H:%M') }}{% endif %}.
          {% elif coverage == 'unverified' %}
          **Ej verifierad månadsenergi – kontrollera totalen.**
          {% endif %}

          {% if missing %}**Saknas:** {{ missing | join(', ')
          | replace('fixed_supplier_fee', 'fast elhandelsavgift')
          | replace('fixed_grid_fee', 'fast elnätsavgift')
          | replace('complete_variable_price', 'komplett rörligt elpris')
          | replace('_', ' ') }}.{% endif %}
          Effektavgifter och andra ej konfigurerade avgifter ingår inte.
          [Om kostnader och mätningens
          täckning](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/costs-and-pricing.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cost_this_month
              name: "Elhandelskostnad den här månaden"
              icon: mdi:calendar-month-outline
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_monthly_peak_hour_consumption
              name: "Energiförbrukning under månadens topptimme"
              icon: mdi:chart-bell-curve
              icon_color: amber
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_time
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_time
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_monthly_peak_hour_time
              name: "Tid för månadens topptimme"
              icon: mdi:clock-outline
              icon_color: amber
              layout: vertical

      # Dölj saknade/okända entiteter, men visa nollvärden och otillgängliga givare.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_production_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Produktion

                Produktion på AC-sidan, exklusive batteriurladdning.
                {% if states('sensor.electricity_pro_production_today') != 'unknown'
                   or states('sensor.electricity_pro_production_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_power
                name: "Produktionseffekt"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

      # Dölj saknade/okända entiteter, men visa nollvärden och otillgängliga givare.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_grid_export_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Export till elnätet

                Energi som levereras till elnätet. Även energi från ett batteri kan ingå.
                {% if states('sensor.electricity_pro_grid_export_today') != 'unknown'
                   or states('sensor.electricity_pro_grid_export_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_power
                name: "Effekt ut till elnätet"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

      # Uppmätt förbrukning är oberoende av elnätsimport och lagringens utformning.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_household_demand_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_household_energy_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_household_energy_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Hushållets energibehov

                Uppmätt förbrukning inklusive elbilsladdning, men exklusive batteriladdning. Detta är hushållets
                energibehov, inte elnätsimport eller en kostnadsuppskattning.
                {% if states('sensor.electricity_pro_household_energy_today') != 'unknown'
                   or states('sensor.electricity_pro_household_energy_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_demand_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_demand_power
                name: "Hushållets effektbehov"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_energy_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_energy_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_energy_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_energy_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

  - title: "Trender"
    path: trends
    icon: mdi:chart-areaspline
    cards:
      - type: custom:mushroom-title-card
        title: "Effekt"
        subtitle: "Uppmätt effekt vid elnätet – senaste 24 timmarna"

      - type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: true
          title: "Effekt vid elnätet"
          show_states: true
          colorize_states: true
        yaxis:
          - min: 0
            decimals: 0
        series:
          - entity: sensor.electricity_pro_current_power
            name: "Aktuell effekt"
            type: line
            color: "#ffb300"
            stroke_width: 1
            float_precision: 0
            show:
              in_header: true
            group_by:
              duration: 5min
              func: avg

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unknown
        card:
          type: custom:apexcharts-card
          graph_span: 24h
          header:
            show: true
            title: "Spotpris, elhandelspris och effektivt elpris"
            show_states: true
            colorize_states: true
          yaxis:
            - min: "~0"
              decimals: 2
          series:
            - entity: sensor.electricity_pro_current_market_price
              name: "Aktuellt spotpris"
              type: line
              curve: stepline
              color: "#b0bec5"
              stroke_width: 2
              float_precision: 2
              show:
                in_header: false
              group_by:
                duration: 15min
                func: avg
            - entity: sensor.electricity_pro_current_supplier_price
              name: "Aktuellt elhandelspris"
              type: line
              color: "#42a5f5"
              stroke_width: 2
              float_precision: 2
              show:
                in_header: true
              group_by:
                duration: 15min
                func: avg
            - entity: sensor.electricity_pro_effective_price
              name: "Effektivt elpris"
              type: line
              color: "#66bb6a"
              stroke_width: 3
              float_precision: 2
              show:
                in_header: true
              group_by:
                duration: 15min
                func: avg

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_consumption_weighted_average_price_today
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_consumption_weighted_average_price_today
            state_not: unknown
        card:
          type: custom:mushroom-entity-card
          entity: sensor.electricity_pro_consumption_weighted_average_price_today
          name: "Effektivt snittpris"
          icon: mdi:chart-line
          icon_color: green

  - title: "Detaljer"
    path: details
    icon: mdi:transmission-tower
    cards:
      - type: custom:mushroom-title-card
        title: "Elektriska mätvärden"
        subtitle: "Valfria mätvärden per fas"

      - type: grid
        columns: 3
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_l1
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_l1
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_l1
              name: "Ström L1"
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 14
                red: 18
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_l2
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_l2
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_l2
              name: "Ström L2"
