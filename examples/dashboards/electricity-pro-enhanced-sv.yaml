  - title: "Prognos"
    path: forecast
    icon: mdi:calendar-clock
    cards:
      - type: custom:mushroom-title-card
        title: "Kommande prisperioder"
        subtitle: "Planeringsråd från den inbyggda Nord Pool-integrationens prognoser"

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_current_market_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_current_market_price
            state_not: unknown
        card:
          type: custom:apexcharts-card
          graph_span: 50h
          span:
            start: day
          update_delay: 3s
          # Följ källans uppdateringar; update_interval kan låsa laddningen i 2.2.3.
          now:
            show: true
            label: "Nu"
            color: "#ef5350"
          header:
            show: true
            title: "Spotprisprognos"
            show_states: true
            colorize_states: true
          yaxis:
            - min: "~0"
              decimals: 2
          apex_config:
            chart:
              animations:
                enabled: false
              redrawOnParentResize: true
              redrawOnWindowResize: true
          series:
            - entity: sensor.electricity_pro_current_market_price
              name: "Spotpris"
              type: line
              curve: stepline
              color: "#42a5f5"
              stroke_width: 2
              float_precision: 2
              extend_to: false
              show:
                in_header: before_now
              data_generator: |
                const intervals = entity.attributes.forecast || [];
                const points = intervals.map((interval) => [
                  new Date(interval.start).getTime(),
                  Number(interval.price),
                ]);
                if (intervals.length > 0) {
                  const last = intervals[intervals.length - 1];
                  points.push([
                    new Date(last.end).getTime(),
                    Number(last.price),
                  ]);
                }
                return points;

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_start
                state_not: unavailable
