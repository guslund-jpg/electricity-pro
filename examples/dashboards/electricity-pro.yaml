                entity: sensor.electricity_pro_consumption_timing_score_yesterday
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_timing_score_yesterday
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_timing_score_yesterday
              name: Consumption timing score yesterday
              icon: mdi:meter-electric-outline
              color: green

      - type: heading
        heading: This month
        icon: mdi:calendar-month

      - type: markdown
        content: >-
          **Monthly total cost estimate** combines observed effective variable
          costs with fixed fees accrued from the start of this calendar month.
          Variable costs may cover a shorter period. Demand charges and other
          unconfigured charges are excluded.
          {% set priced = state_attr('sensor.electricity_pro_total_cost_estimate_this_month', 'priced_energy_kwh') %}
          {% if priced is not none %}Variable cost covers {{ priced | float(0) | round(2) }} kWh.{% endif %}
          {% set missing = state_attr('sensor.electricity_pro_total_cost_estimate_this_month', 'missing_components') or [] %}
          {% if missing %}Missing settings: {{ missing | join(', ') | replace('_', ' ') }}.{% endif %}

          Monthly supplier cost excludes grid charges and fixed fees.

          {% set coverage = state_attr('sensor.electricity_pro_energy_this_month', 'coverage') %}
          {% if coverage == 'partial' %}
          **Partial monthly energy:** counted since tracking started or was reset.
          {% set started = as_datetime(state_attr('sensor.electricity_pro_energy_this_month', 'tracking_started_at'), none) %}
          {% if started is not none %}
          Started {{ as_local(started).strftime('%d %b %Y, %H:%M') }}.
          {% endif %}
          {% elif coverage == 'unverified' %}
          **Unverified monthly energy:** restored from an older version.
          Check the total before relying on it.
          {% endif %}

          {% if state_attr('sensor.electricity_pro_cost_this_month', 'source') == 'local_estimate' %}
          **Partial monthly cost estimate:** covers
          {{ state_attr('sensor.electricity_pro_cost_this_month', 'priced_energy_kwh') | float(0) | round(2) }}
          kWh of priced consumption. Energy and cost may cover different periods.
          {% endif %}

      - type: grid
        columns: 2
        square: false
        cards:
