title: Electricity Pro

views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: heading
        heading: Electricity Pro
        icon: mdi:home-lightning-bolt

      - type: grid
        columns: 2
        square: false
        cards:
          # Example thresholds: edit max and severity to suit your home.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: Current power
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/kWh unit.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/hour unit.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "on"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: Good time to use electricity
              icon: mdi:check-circle-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "off"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: Wait for a better price
              icon: mdi:clock-outline
              color: amber

      - type: heading
        heading: Today
        icon: mdi:calendar-today

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_today' %}
          {% set supplier = 'sensor.electricity_pro_cost_today' %}
          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if priced is not none %}
          **Partial estimate:** {{ priced | float(0) | round(2) }} kWh priced.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Partial supplier estimate:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }} kWh priced.
          {% endif %}
          Total includes fixed fees accrued since midnight.

          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if missing %}**Missing:** {{ missing | join(', ') | replace('_', ' ') }}.{% endif %}
          Demand/other unconfigured charges excluded.
          [Cost & coverage details](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/household-cost-estimates.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_today
              name: Energy today
              icon: mdi:lightning-bolt
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_today
              name: Total cost estimate today
              icon: mdi:cash-multiple
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_today
              name: Supplier cost today
              icon: mdi:cash
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: Average effective price today
              icon: mdi:chart-line
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_peak_power_today
              name: Peak power today
              icon: mdi:flash-outline
              color: amber

      # Hide absent/unknown entities, but retain zero and unavailable readings.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_production_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Production

                AC generation, excluding battery discharge.
                {% if states('sensor.electricity_pro_production_today') != 'unknown'
                   or states('sensor.electricity_pro_production_this_month') != 'unknown' %}
                **Partial energy totals:** observed increments only, not complete
                day/month totals.
                {% endif %}
                [Flow details](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_power
                name: Production power
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_today
                name: Today (partial)
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_this_month
                name: This month (partial)
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

      # Hide absent/unknown entities, but retain zero and unavailable readings.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_grid_export_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Grid export

                Energy delivered to the grid; its source may include a battery.
                {% if states('sensor.electricity_pro_grid_export_today') != 'unknown'
                   or states('sensor.electricity_pro_grid_export_this_month') != 'unknown' %}
                **Partial energy totals:** observed increments only, not complete
                day/month totals.
                {% endif %}
                [Flow details](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_power
                name: Grid export power
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_today
                name: Today (partial)
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_this_month
                name: This month (partial)
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

  - title: Live
