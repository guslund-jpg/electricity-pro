              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_today
              name: Energy today
              icon: mdi:lightning-bolt
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_today
              name: Total cost estimate today
              icon: mdi:cash-multiple
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_today
              name: Supplier cost today
              icon: mdi:cash
