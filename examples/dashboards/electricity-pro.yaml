title: Electricity Pro

views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: heading
        heading: Electricity Pro
        icon: mdi:home-lightning-bolt

      - type: grid
        columns: 2
        square: false
        cards:
          # Example thresholds: edit max and severity to suit your home.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: Current power
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/kWh unit.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/hour unit.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "on"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: Good time to use electricity
              icon: mdi:check-circle-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "off"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: Wait for a better price
              icon: mdi:clock-outline
              color: amber

      - type: heading
        heading: Today
        icon: mdi:calendar-today

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_today
              name: Energy today
              icon: mdi:lightning-bolt
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_today
              name: Cost today
              icon: mdi:cash
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: Average price paid today
              icon: mdi:chart-line
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_peak_power_today
              name: Peak power today
              icon: mdi:flash-outline
              color: amber

  - title: Live
    path: live
    icon: mdi:flash
    cards:
      - type: heading
        heading: Live electricity
        icon: mdi:flash

      - type: grid
        columns: 2
        square: false
        cards:
          # Example thresholds: edit max and severity to suit your home.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: Current power
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/kWh unit.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/hour unit.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

      - type: history-graph
        title: Power — last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.electricity_pro_current_power
            name: Current power

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unknown
        card:
          type: history-graph
          title: Market, supplier, and effective price — last 24 hours
          hours_to_show: 24
          entities:
            - entity: sensor.electricity_pro_current_market_price
              name: Market price
            - entity: sensor.electricity_pro_current_price
              name: Supplier price
            - entity: sensor.electricity_pro_effective_price
              name: Effective price

