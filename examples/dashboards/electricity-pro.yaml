            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_this_month
              name: Energy this month
              icon: mdi:calendar-month
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_this_month
              name: Total cost estimate this month
              icon: mdi:calendar-month-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_this_month
              name: Supplier cost this month
              icon: mdi:calendar-month-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_monthly_peak_hour_consumption
              name: Monthly peak-hour consumption
              icon: mdi:chart-bell-curve
              color: amber

          - type: conditional
            conditions:
