              - condition: state
                entity: sensor.electricity_pro_current_price
                state_not:
                  - unavailable
                  - unknown
            card:
              type: tile
              entity: sensor.electricity_pro_current_price
              name: Current supplier price
              icon: mdi:currency-usd
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not:
                  - unavailable
                  - unknown
            card:
              # Example thresholds in the sensor's currency/kWh unit.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not:
                  - unavailable
                  - unknown
            card:
              # Example thresholds in the sensor's currency/hour unit.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

      - type: history-graph
        title: Power — last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.electricity_pro_current_power
            name: Current power

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not:
              - unavailable
              - unknown
        card:
          type: history-graph
          title: Effective price — last 24 hours
          hours_to_show: 24
          entities:
            - entity: sensor.electricity_pro_effective_price
              name: Effective price

