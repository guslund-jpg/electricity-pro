# Optional Enhanced Clean dashboard. Requires Mushroom and ApexCharts Card.
# Installation, measurement coverage and example scales: README.md.
title: Electricity Pro Enhanced Clean
views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: custom:mushroom-title-card
        title: Electricity Pro
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: Current power
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unavailable
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unknown
        card:
          type: custom:mushroom-template-card
          entity: binary_sensor.electricity_pro_good_time_to_use_electricity
          primary: |-
            {{ 'Good time to use electricity'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'Wait for a better price' }}
          secondary: |-
            {% set price = states('sensor.electricity_pro_effective_price') %} Effective price: {{ '%.2f' | format(price | float)
               if price not in ['unknown', 'unavailable'] else price }}
            {{ state_attr('sensor.electricity_pro_effective_price',
                          'unit_of_measurement') or '' }}
          icon: |-
            {{ 'mdi:check-circle-outline'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'mdi:clock-outline' }}
          icon_color: |-
            {{ 'green'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'orange' }}
          tap_action:
            action: more-info
      - type: custom:mushroom-title-card
        title: Cheapest windows
      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_1h_window_start
              name: Cheapest 1h window
              icon: mdi:clock-fast
              icon_color: green
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
              name: Cheapest 1h average price
              icon: mdi:cash-clock
              icon_color: green
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_2h_window_start
              name: Cheapest 2h window
              icon: mdi:clock-fast
              icon_color: blue
              layout: vertical
          - type: conditional
