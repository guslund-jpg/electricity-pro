              entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
              name: Cheapest 1h average price
              icon: mdi:cash-clock
              icon_color: green
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_2h_window_start
              name: Cheapest 2h window
              icon: mdi:clock-fast
              icon_color: blue
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
              name: Cheapest 2h average price
              icon: mdi:cash-clock
