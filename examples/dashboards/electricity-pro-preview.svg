<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Electricity Pro standard dashboard preview</title>
  <desc id="desc">Illustrative Home Assistant dashboard with live, daily, and monthly electricity cards.</desc>
  <rect width="1200" height="720" fill="#101418"/>
  <rect width="1200" height="72" fill="#181d22"/>
  <circle cx="38" cy="36" r="16" fill="#03a9f4"/>
  <path d="M42 17L27 39h11l-3 17 16-24H40z" fill="#fff"/>
  <text x="72" y="45" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="26" font-weight="700">Electricity Pro</text>
  <text x="780" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Overview</text>
  <text x="880" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Live</text>
  <text x="944" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Today</text>
  <text x="1020" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Month</text>
  <rect x="775" y="63" width="82" height="4" rx="2" fill="#03a9f4"/>

  <text x="42" y="118" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Now</text>
