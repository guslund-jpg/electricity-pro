  <text x="42" y="302" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Today</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 322)">
      <rect width="252" height="112" rx="16" fill="#1c2329" stroke="#303940"/>
      <text x="24" y="36" fill="#aeb8c0" font-size="16">Energy today</text>
      <text x="24" y="78" fill="#f4f7f9" font-size="30" font-weight="700">14.8 kWh</text>
    </g>
    <g transform="translate(330 322)">
      <rect width="252" height="112" rx="16" fill="#1c2329" stroke="#303940"/>
