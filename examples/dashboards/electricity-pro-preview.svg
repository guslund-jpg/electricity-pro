      <text x="24" y="36" fill="#aeb8c0" font-size="16">Peak power today</text>
      <text x="24" y="78" fill="#f4f7f9" font-size="30" font-weight="700">5,120 W</text>
    </g>
  </g>

  <text x="42" y="486" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">This month</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 506)">
      <rect width="348" height="112" rx="16" fill="#1c2329" stroke="#303940"/>
      <text x="24" y="36" fill="#aeb8c0" font-size="16">Energy this month</text>
      <text x="24" y="78" fill="#f4f7f9" font-size="30" font-weight="700">186.4 kWh</text>
    </g>
    <g transform="translate(426 506)">
      <rect width="348" height="112" rx="16" fill="#1c2329" stroke="#303940"/>
      <text x="24" y="36" fill="#aeb8c0" font-size="16">Cost this month</text>
      <text x="24" y="78" fill="#f4f7f9" font-size="30" font-weight="700">231.10 SEK</text>
