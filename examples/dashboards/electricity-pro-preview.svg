    <g transform="translate(810 506)">
      <rect width="348" height="112" rx="16" fill="#1c2329" stroke="#303940"/>
      <text x="24" y="36" fill="#aeb8c0" font-size="16">Monthly peak hour</text>
      <text x="24" y="73" fill="#f4f7f9" font-size="26" font-weight="700">4.82 kWh</text>
      <text x="24" y="98" fill="#aeb8c0" font-size="15">6 August, 17:00</text>
    </g>
