<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Electricity Pro enhanced dashboard preview</title>
  <desc id="desc">Illustrative enhanced Home Assistant dashboard with status cards and power and price charts.</desc>
  <rect width="1200" height="720" fill="#0e1317"/>
  <rect width="1200" height="72" fill="#171d22"/>
  <circle cx="38" cy="36" r="16" fill="#03a9f4"/>
  <path d="M42 17L27 39h11l-3 17 16-24H40z" fill="#fff"/>
  <text x="72" y="44" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="25" font-weight="700">Electricity Pro Enhanced</text>
  <text x="900" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Overview</text>
  <text x="1000" y="43" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="17">Trends</text>
  <text x="1070" y="43" fill="#8f9ba5" font-family="Arial, sans-serif" font-size="17">Details</text>
  <rect x="994" y="63" width="60" height="4" rx="2" fill="#03a9f4"/>

  <g font-family="Arial, sans-serif">
    <text x="42" y="118" fill="#f4f7f9" font-size="23" font-weight="700">Power</text>
    <text x="42" y="143" fill="#8f9ba5" font-size="15">Recorded household demand — last 24 hours</text>

    <g transform="translate(42 165)">
      <rect width="1116" height="238" rx="18" fill="#1b2228" stroke="#303940"/>
      <text x="28" y="38" fill="#f4f7f9" font-size="18" font-weight="700">Household power</text>
      <text x="930" y="38" fill="#ffca45" font-size="18" font-weight="700">2,340 W</text>
      <g stroke="#344049" stroke-width="1">
        <line x1="54" y1="76" x2="1080" y2="76"/>
        <line x1="54" y1="126" x2="1080" y2="126"/>
        <line x1="54" y1="176" x2="1080" y2="176"/>
      </g>
      <path d="M54 182 C120 170 135 102 205 128 S315 196 374 151 S475 64 541 111 S650 186 720 158 S826 91 892 123 S1010 183 1080 97" fill="none" stroke="#ffb300" stroke-width="2"/>
      <text x="54" y="225" fill="#75818a" font-size="13">24 hours ago</text>
      <text x="548" y="225" fill="#75818a" font-size="13">12 hours ago</text>
      <text x="1035" y="225" fill="#75818a" font-size="13">Now</text>
    </g>

    <text x="42" y="448" fill="#f4f7f9" font-size="23" font-weight="700">Prices</text>
    <g transform="translate(42 468)">
      <rect width="760" height="190" rx="18" fill="#1b2228" stroke="#303940"/>
      <text x="28" y="38" fill="#f4f7f9" font-size="18" font-weight="700">Supplier and effective price</text>
      <line x1="44" y1="72" x2="724" y2="72" stroke="#344049"/>
      <line x1="44" y1="120" x2="724" y2="120" stroke="#344049"/>
      <path d="M44 135 L130 128 L216 96 L302 112 L388 77 L474 91 L560 58 L646 84 L724 62" fill="none" stroke="#42a5f5" stroke-width="3"/>
      <path d="M44 108 L130 101 L216 69 L302 85 L388 50 L474 64 L560 31 L646 57 L724 35" fill="none" stroke="#66bb6a" stroke-width="4"/>
      <circle cx="48" cy="167" r="5" fill="#42a5f5"/>
      <text x="60" y="172" fill="#aeb8c0" font-size="14">Supplier price</text>
      <circle cx="190" cy="167" r="5" fill="#66bb6a"/>
      <text x="202" y="172" fill="#aeb8c0" font-size="14">Effective price</text>
    </g>

    <g transform="translate(838 468)">
      <rect width="320" height="82" rx="18" fill="#173f32" stroke="#2b7d5f"/>
      <circle cx="42" cy="41" r="23" fill="#215d48"/>
      <text x="34" y="50" fill="#70efb8" font-size="25">✓</text>
      <text x="78" y="34" fill="#a9e8d0" font-size="14">Good time to use electricity</text>
      <text x="78" y="59" fill="#f4f7f9" font-size="19" font-weight="700">Effective price 1.24</text>
    </g>
    <g transform="translate(838 576)">
      <rect width="320" height="82" rx="18" fill="#1b2228" stroke="#303940"/>
      <text x="24" y="30" fill="#aeb8c0" font-size="14">Average effective price today</text>
      <text x="24" y="59" fill="#f4f7f9" font-size="24" font-weight="700">1.18 SEK/kWh</text>
    </g>
  </g>
  <text x="42" y="694" fill="#75818a" font-family="Arial, sans-serif" font-size="13">Illustrative preview — Mushroom and ApexCharts Card are optional presentation dependencies.</text>
</svg>
