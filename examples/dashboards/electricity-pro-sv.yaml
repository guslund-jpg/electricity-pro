# Svensk version. Uppdatera tillsammans med den engelska YAML-filen.
title: Electricity Pro

views:
  - title: "Översikt"
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: heading
        heading: Electricity Pro
        icon: mdi:home-lightning-bolt

      - type: grid
        columns: 2
        square: false
        cards:
          # Exempelgränser: anpassa max och severity till ditt hushåll.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: "Aktuell effekt"
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Exempelgränser i givarens valuta per kWh.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: "Effektivt elpris"
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Exempelgränser i givarens valuta per timme.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: "Kostnad per timme just nu"
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "on"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: "Bra tillfälle att använda el"
              icon: mdi:check-circle-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.electricity_pro_good_time_to_use_electricity
                state: "off"
            card:
              type: tile
              entity: sensor.electricity_pro_effective_price
              name: "Vänta på ett bättre pris"
              icon: mdi:clock-outline
              color: amber

      - type: heading
        heading: "I dag"
        icon: mdi:calendar-today

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_today' %}
          {% set supplier = 'sensor.electricity_pro_cost_today' %}
          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if priced is not none %}
          **Delvis beräknad kostnad:** {{ priced | float(0) | round(2) }} kWh prissatta.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Delvis beräknad elhandelskostnad:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }}
          kWh prissatta.
          {% endif %}
          Totalen inkluderar fasta avgifter upplupna sedan midnatt.

          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if missing %}**Saknas:** {{ missing | join(', ')
          | replace('fixed_supplier_fee', 'fast elhandelsavgift')
          | replace('fixed_grid_fee', 'fast elnätsavgift')
          | replace('complete_variable_price', 'komplett rörligt elpris')
          | replace('_', ' ') }}.{% endif %}
          Effektavgifter och andra ej konfigurerade avgifter ingår inte.
          [Om kostnader och mätningens
          täckning](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/costs-and-pricing.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_today
              name: "Energi i dag"
              icon: mdi:lightning-bolt
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_today
              name: "Uppskattad total kostnad i dag"
              icon: mdi:cash-multiple
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_today
              name: "Elhandelskostnad i dag"
              icon: mdi:cash
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: "Genomsnittligt effektivt elpris i dag"
              icon: mdi:chart-line
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_peak_power_today
              name: "Högsta effekt i dag"
              icon: mdi:flash-outline
              color: amber

      # Dölj saknade/okända entiteter, men visa nollvärden och otillgängliga givare.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_production_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_production_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Produktion

                Produktion på AC-sidan, exklusive batteriurladdning.
                {% if states('sensor.electricity_pro_production_today') != 'unknown'
                   or states('sensor.electricity_pro_production_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_power
                name: "Produktionseffekt"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_production_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_production_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:solar-power
                color: amber
                tap_action:
                  action: more-info

      # Dölj saknade/okända entiteter, men visa nollvärden och otillgängliga givare.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_grid_export_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_grid_export_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Export till elnätet

                Energi som levereras till elnätet. Även energi från ett batteri kan ingå.
                {% if states('sensor.electricity_pro_grid_export_today') != 'unknown'
                   or states('sensor.electricity_pro_grid_export_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_power
                name: "Effekt ut till elnätet"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_grid_export_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_grid_export_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:transmission-tower-export
                color: blue
                tap_action:
                  action: more-info

      # Uppmätt förbrukning är oberoende av elnätsimport och lagringens utformning.
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.electricity_pro_household_demand_power
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_household_energy_today
                state_not: unknown
              - condition: state
                entity: sensor.electricity_pro_household_energy_this_month
                state_not: unknown
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >-
                ### Hushållets energibehov

                Uppmätt förbrukning inklusive elbilsladdning, men exklusive batteriladdning. Detta är hushållets
                energibehov, inte elnätsimport eller en kostnadsuppskattning.
                {% if states('sensor.electricity_pro_household_energy_today') != 'unknown'
                   or states('sensor.electricity_pro_household_energy_this_month') != 'unknown' %}
                **Delvis uppmätt energi:** endast observerade ökningar, inte kompletta dygns- eller månadstotaler.
                {% endif %}
                [Om mätning av
                energiflöden](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/production-export.md)

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_demand_power
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_demand_power
                name: "Hushållets effektbehov"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_energy_today
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_energy_today
                name: "I dag (delvis uppmätt)"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

            - type: conditional
              conditions:
                - condition: state
                  entity: sensor.electricity_pro_household_energy_this_month
                  state_not: unknown
              card:
                type: tile
                entity: sensor.electricity_pro_household_energy_this_month
                name: "Den här månaden (delvis uppmätt)"
                icon: mdi:home-lightning-bolt
                color: green
                tap_action:
                  action: more-info

  - title: "Aktuellt"
    path: live
    icon: mdi:flash
    cards:
      - type: heading
        heading: "El just nu"
        icon: mdi:flash

      - type: grid
        columns: 2
        square: false
        cards:
          # Exempelgränser: anpassa max och severity till ditt hushåll.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: "Aktuell effekt"
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Exempelgränser i givarens valuta per kWh.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: "Effektivt elpris"
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Exempelgränser i givarens valuta per timme.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: "Kostnad per timme just nu"
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

      - type: history-graph
        title: "Effekt – senaste 24 timmarna"
        hours_to_show: 24
        entities:
          - entity: sensor.electricity_pro_current_power
            name: "Aktuell effekt"

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unknown
        card:
          type: history-graph
          title: "Spotpris, elhandelspris och effektivt elpris – senaste 24 timmarna"
          hours_to_show: 24
          entities:
            - entity: sensor.electricity_pro_current_market_price
              name: "Spotpris"
            - entity: sensor.electricity_pro_current_supplier_price
              name: "Elhandelspris"
            - entity: sensor.electricity_pro_effective_price
              name: "Effektivt elpris"

  - title: "Statistik"
    path: statistics
    icon: mdi:calendar-range
    cards:
      - type: heading
        heading: "Dagens totaler"
        icon: mdi:calendar-today

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_today' %}
          {% set supplier = 'sensor.electricity_pro_cost_today' %}
          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if priced is not none %}
          **Delvis beräknad kostnad:** {{ priced | float(0) | round(2) }} kWh prissatta.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Delvis beräknad elhandelskostnad:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }}
          kWh prissatta.
          {% endif %}
          Totalen inkluderar fasta avgifter upplupna sedan midnatt.

          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if missing %}**Saknas:** {{ missing | join(', ')
          | replace('fixed_supplier_fee', 'fast elhandelsavgift')
          | replace('fixed_grid_fee', 'fast elnätsavgift')
          | replace('complete_variable_price', 'komplett rörligt elpris')
          | replace('_', ' ') }}.{% endif %}
          Effektavgifter och andra ej konfigurerade avgifter ingår inte.
          [Om kostnader och mätningens
          täckning](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/costs-and-pricing.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_today
              name: "Energi i dag"
              icon: mdi:lightning-bolt
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_today
              name: "Uppskattad total kostnad i dag"
              icon: mdi:cash-multiple
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_today
              name: "Elhandelskostnad i dag"
              icon: mdi:cash
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: "Genomsnittligt effektivt elpris i dag"
              icon: mdi:chart-line
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_remaining_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_remaining_cost_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_remaining_cost_today
              name: "Återstående kostnad i dag"
              icon: mdi:progress-clock
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_average_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_average_power_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_average_power_today
              name: "Genomsnittlig effekt i dag"
              icon: mdi:chart-areaspline
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_peak_power_today
              name: "Högsta effekt i dag"
              icon: mdi:flash-outline
              color: amber

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_time_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_time_today
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_peak_power_time_today
              name: "Tid för dagens högsta effekt"
              icon: mdi:clock-outline
              color: amber

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_timing_score_yesterday
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_timing_score_yesterday
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_consumption_timing_score_yesterday
              name: "Tidsanpassningspoäng för gårdagens förbrukning"
              icon: mdi:meter-electric-outline
              color: green

      - type: heading
        heading: "Den här månaden"
        icon: mdi:calendar-month

      - type: markdown
        content: >-
          {% set total = 'sensor.electricity_pro_total_cost_estimate_this_month' %}
          {% set supplier = 'sensor.electricity_pro_cost_this_month' %}
          {% set priced = state_attr(total, 'priced_energy_kwh') %}
          {% if priced is not none %}
          **Delvis beräknad kostnad:** {{ priced | float(0) | round(2) }} kWh prissatta.
          {% elif state_attr(supplier, 'source') == 'local_estimate' %}
          **Delvis beräknad elhandelskostnad:** {{ state_attr(supplier, 'priced_energy_kwh') | float(0) | round(2) }}
          kWh prissatta.
          {% endif %}
          Totalen inkluderar fasta avgifter upplupna sedan månadens början.

          {% set coverage = state_attr('sensor.electricity_pro_energy_this_month', 'coverage') %}
          {% if coverage == 'partial' %}
          {% set started = as_datetime(state_attr('sensor.electricity_pro_energy_this_month', 'tracking_started_at'),
          none) %}
          **Delvis uppmätt månadsenergi**{% if started is not none %}  sedan {{ as_local(started).strftime('%Y-%m-%d
          %H:%M') }}{% endif %}.
          {% elif coverage == 'unverified' %}
          **Ej verifierad månadsenergi – kontrollera totalen.**
          {% endif %}

          {% set missing = state_attr(total, 'missing_components') or [] %}
          {% if missing %}**Saknas:** {{ missing | join(', ')
          | replace('fixed_supplier_fee', 'fast elhandelsavgift')
          | replace('fixed_grid_fee', 'fast elnätsavgift')
          | replace('complete_variable_price', 'komplett rörligt elpris')
          | replace('_', ' ') }}.{% endif %}
          Effektavgifter och andra ej konfigurerade avgifter ingår inte.
          [Om kostnader och mätningens
          täckning](https://github.com/guslund-jpg/electricity-pro/blob/main/docs/guides/costs-and-pricing.md)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_energy_this_month
              name: "Energi den här månaden"
              icon: mdi:calendar-month
              color: blue

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_total_cost_estimate_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_total_cost_estimate_this_month
              name: "Uppskattad total kostnad den här månaden"
              icon: mdi:calendar-month-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_cost_this_month
              name: "Elhandelskostnad den här månaden"
              icon: mdi:calendar-month-outline
              color: green

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unknown
            card:
              type: tile
              entity: sensor.electricity_pro_monthly_peak_hour_consumption
              name: "Energiförbrukning under månadens topptimme"
              icon: mdi:chart-bell-curve
              color: amber

          - type: conditional
            conditions:
