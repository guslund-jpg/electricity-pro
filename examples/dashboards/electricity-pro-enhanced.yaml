title: Electricity Pro Enhanced

views:
  - title: Overview
    path: overview
    icon: mdi:home-lightning-bolt
    cards:
      - type: custom:mushroom-title-card
        title: Electricity Pro
        subtitle: Live measurements, statistics, and insight

      - type: grid
        columns: 2
        square: false
        cards:
          # Example thresholds: edit max and severity to suit your home.
          - type: gauge
            entity: sensor.electricity_pro_current_power
            name: Current power
            min: 0
            max: 10000
            needle: true
            severity:
              green: 0
              yellow: 4000
              red: 7000

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_effective_price
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/kWh unit.
              type: gauge
              entity: sensor.electricity_pro_effective_price
              name: Effective price
              min: 0
              max: 3
              needle: true
              severity:
                green: 0
                yellow: 1
                red: 1.5

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_cost_rate
                state_not: unknown
            card:
              # Example thresholds in the sensor's currency/hour unit.
              type: gauge
              entity: sensor.electricity_pro_current_cost_rate
              name: Current cost rate
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 5
                red: 10

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unavailable
          - condition: state
            entity: binary_sensor.electricity_pro_good_time_to_use_electricity
            state_not: unknown
        card:
          type: custom:mushroom-template-card
          entity: binary_sensor.electricity_pro_good_time_to_use_electricity
          primary: >-
            {{ 'Good time to use electricity'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'Wait for a better price' }}
          secondary: >-
            Effective price:
            {{ states('sensor.electricity_pro_effective_price') }}
            {{ state_attr('sensor.electricity_pro_effective_price',
                          'unit_of_measurement') or '' }}
          icon: >-
            {{ 'mdi:check-circle-outline'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'mdi:clock-outline' }}
          icon_color: >-
            {{ 'green'
               if is_state('binary_sensor.electricity_pro_good_time_to_use_electricity', 'on')
               else 'orange' }}
          tap_action:
            action: more-info

      - type: custom:mushroom-title-card
        title: Today

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_energy_today
              name: Energy today
              icon: mdi:lightning-bolt
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cost_today
              name: Cost today
              icon: mdi:cash
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_consumption_weighted_average_price_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_consumption_weighted_average_price_today
              name: Average effective price today
              icon: mdi:chart-line
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_peak_power_today
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_peak_power_today
              name: Peak power today
              icon: mdi:flash-outline
              icon_color: amber
              layout: vertical

      - type: custom:mushroom-title-card
        title: This month

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_energy_this_month
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_energy_this_month
              name: Energy this month
              icon: mdi:calendar-month
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cost_this_month
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cost_this_month
              name: Cost this month
              icon: mdi:calendar-month-outline
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_consumption
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_monthly_peak_hour_consumption
              name: Monthly peak-hour consumption
              icon: mdi:chart-bell-curve
              icon_color: amber
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_time
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_monthly_peak_hour_time
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_monthly_peak_hour_time
              name: Monthly peak-hour time
              icon: mdi:clock-outline
              icon_color: amber
              layout: vertical

  - title: Trends
    path: trends
    icon: mdi:chart-areaspline
    cards:
      - type: custom:mushroom-title-card
        title: Power
        subtitle: Recorded household demand — last 24 hours

      - type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: true
          title: Household power
          show_states: true
          colorize_states: true
        yaxis:
          - min: 0
            decimals: 0
        series:
          - entity: sensor.electricity_pro_current_power
            name: Current power
            type: area
            color: "#ffb300"
            stroke_width: 2
            float_precision: 0
            show:
              in_header: true
            group_by:
              duration: 5min
              func: avg

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_effective_price
            state_not: unknown
        card:
          type: custom:apexcharts-card
          graph_span: 24h
          header:
            show: true
            title: Market, supplier, and effective price
            show_states: true
            colorize_states: true
          yaxis:
            - min: "~0"
              decimals: 2
          series:
            - entity: sensor.electricity_pro_current_market_price
              name: Current market price
              type: line
              curve: stepline
              color: "#b0bec5"
              stroke_width: 2
              float_precision: 2
              show:
                in_header: false
              group_by:
                duration: 15min
                func: avg
            - entity: sensor.electricity_pro_current_price
              name: Current supplier price
              type: line
              color: "#42a5f5"
              stroke_width: 2
              float_precision: 2
              show:
                in_header: true
              group_by:
                duration: 15min
                func: avg
            - entity: sensor.electricity_pro_effective_price
              name: Effective price
              type: line
              color: "#66bb6a"
              stroke_width: 3
              float_precision: 2
              show:
                in_header: true
              group_by:
                duration: 15min
                func: avg

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_consumption_weighted_average_price_today
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_consumption_weighted_average_price_today
            state_not: unknown
        card:
          type: custom:mushroom-entity-card
          entity: sensor.electricity_pro_consumption_weighted_average_price_today
          name: Average effective price today
          icon: mdi:chart-line
          icon_color: green

  - title: Details
    path: details
    icon: mdi:transmission-tower
    cards:
      - type: custom:mushroom-title-card
        title: Electrical details
        subtitle: Optional phase measurements

      - type: grid
        columns: 3
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_l1
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_l1
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_l1
              name: Current L1
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 14
                red: 18
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_l2
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_l2
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_l2
              name: Current L2
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 14
                red: 18
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_current_l3
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_current_l3
                state_not: unknown
            card:
              type: gauge
              entity: sensor.electricity_pro_current_l3
              name: Current L3
              min: 0
              max: 20
              needle: true
              severity:
                green: 0
                yellow: 14
                red: 18
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_voltage_l1
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_voltage_l1
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_voltage_l1
              name: Voltage L1
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_voltage_l2
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_voltage_l2
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_voltage_l2
              name: Voltage L2
              layout: vertical
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_voltage_l3
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_voltage_l3
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_voltage_l3
              name: Voltage L3
              layout: vertical

  - title: Forecast
    path: forecast
    icon: mdi:calendar-clock
    cards:
      - type: custom:mushroom-title-card
        title: Upcoming price windows
        subtitle: Scheduling insights from native Nord Pool forecasts

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.electricity_pro_current_market_price
            state_not: unavailable
          - condition: state
            entity: sensor.electricity_pro_current_market_price
            state_not: unknown
        card:
          type: custom:apexcharts-card
          graph_span: 50h
          span:
            start: day
          update_interval: 5min
          now:
            show: true
            label: Now
            color: "#ef5350"
          header:
            show: true
            title: Market price forecast
            show_states: true
            colorize_states: true
          yaxis:
            - min: "~0"
              decimals: 2
          series:
            - entity: sensor.electricity_pro_current_market_price
              name: Market price
              type: line
              curve: stepline
              color: "#42a5f5"
              stroke_width: 2
              float_precision: 2
              extend_to: false
              show:
                in_header: true
                extremas: time
              data_generator: |
                const intervals = entity.attributes.forecast || [];
                const points = [];
                intervals.forEach((interval, index) => {
                  const start = new Date(interval.start).getTime();
                  const end = new Date(interval.end).getTime();
                  if (index > 0) {
                    const previousEnd = new Date(
                      intervals[index - 1].end
                    ).getTime();
                    if (start > previousEnd) {
                      points.push([previousEnd, null]);
                    }
                  }
                  points.push([start, interval.price]);
                  points.push([end, interval.price]);
                });
                return points;

      - type: grid
        columns: 2
        square: false
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_1h_window_start
              name: Cheapest 1h window
              icon: mdi:clock-fast
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_1h_window_average_effective_price
              name: Cheapest 1h average price
              icon: mdi:cash-clock
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_2h_window_start
              name: Cheapest 2h window
              icon: mdi:clock-fast
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_2h_window_average_effective_price
              name: Cheapest 2h average price
              icon: mdi:cash-clock
              icon_color: blue
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_3h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_3h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_3h_window_start
              name: Cheapest 3h window
              icon: mdi:clock-fast
              icon_color: purple
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_cheapest_3h_window_average_effective_price
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_cheapest_3h_window_average_effective_price
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_cheapest_3h_window_average_effective_price
              name: Cheapest 3h average price
              icon: mdi:cash-clock
              icon_color: purple
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_next_inexpensive_1h_window_start
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_next_inexpensive_1h_window_start
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_next_inexpensive_1h_window_start
              name: Next inexpensive hour
              icon: mdi:clock-check-outline
              icon_color: green
              layout: vertical

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.electricity_pro_price_direction
                state_not: unavailable
              - condition: state
                entity: sensor.electricity_pro_price_direction
                state_not: unknown
            card:
              type: custom:mushroom-entity-card
              entity: sensor.electricity_pro_price_direction
              name: Price direction
              icon: mdi:trending-up
              icon_color: amber
              layout: vertical
