# Keep this baseline small; add rule families in separate reviewed changes.
# The minimum supported Home Assistant (2026.9) runs Python 3.14.
target-version = "py314"
line-length = 88

[lint]
# Import placement / statement errors and Pyflakes (including unused imports,
# undefined names and unused locals), function complexity and explicit zip lengths.
# No integration/test-wide suppressions.
select = ["E4", "E7", "E9", "F", "C901", "B905"]

[lint.mccabe]
max-complexity = 20

[format]
# Shared formatter policy, checked in CI and pre-commit.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
