# Keep this baseline small; add rule families in separate reviewed changes.
# The minimum supported Home Assistant (2025.9) runs Python 3.13.
target-version = "py313"
line-length = 88

[lint]
# Import placement / statement errors and Pyflakes (including unused imports,
# undefined names and unused locals). No integration/test-wide suppressions.
select = ["E4", "E7", "E9", "F"]

[format]
# Shared formatter policy, checked in CI and pre-commit.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
